name: Build Joya Recharge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android_project
          unzip -o JoyaRecharge_Android_Project.zip -d android_project

      - name: Find Android project
        run: |
          echo "Searching Android project..."
          find android_project -maxdepth 6 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android_project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "ZIP ke andar Gradle project files nahi mile."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found. Using installed Gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "APK files:"
          find android_project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyaRecharge-APK
          path: android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
